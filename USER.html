<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ngopi Dulu — Order Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --rose:       #E4D0CE;
    --mauve:      #825455;
    --card-beige: #E7DAC4;
    --grey-opt:   #E2E1DF;
    --ink:        #1F1717;
    --paper:      #FFFFFF;
    --good:       #1FAA4E;
    --bad:        #E02F2F;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body { height: 100%; width: 100%; }
  body {
    background: #121214;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'IBM Plex Mono', monospace;
    overflow: hidden;
  }

  .app {
    width: 100%;
    max-width: 440px;
    height: 100dvh;
    background: var(--paper);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Closed Café Shift Lock Screen */
  #closed-overlay {
    position: absolute;
    inset: 0;
    background: #121214;
    color: #fff;
    z-index: 9999;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 30px;
    text-align: center;
  }
  .closed-badge {
    background: var(--mauve);
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    margin-bottom: 20px;
  }
  .closed-title {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.5;
    color: #E4D0CE;
  }

  .screen { position: absolute; inset: 0; display: none !important; flex-direction: column; background: var(--paper); z-index: 10; }
  .screen.active { display: flex !important; z-index: 20; }

  #screen-start { background: var(--paper); justify-content: center; align-items: center; padding: 16px; }
  .start-bg-front {
    position: absolute; width: 78%; height: 74%; background: var(--rose); border-radius: 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .logo-pill { background: var(--ink); color: #fff; border-radius: 40px; padding: 10px 24px; font-weight: 700; font-size: 14px; text-transform: uppercase; }
  .name-field { background: transparent; border: none; border-bottom: 2px solid var(--ink); text-align: center; font-weight: 700; font-size: 14px; padding: 4px; width: 160px; outline: none; margin: 16px 0 20px; }
  .start-btn { background: #ba9999; color: #fff; border-radius: 8px; padding: 12px 24px; font-weight: 700; font-size: 12px; border: none; cursor: pointer; }
  .start-btn:disabled { opacity: 0.45; }

  /* Menu Layout */
  #screen-menu { flex-direction: column; }
  .menu-content-split { display: flex; flex: 1; overflow: hidden; }
  .sidebar { width: 70px; background: var(--rose); display: flex; flex-direction: column; align-items: center; padding-top: 10px; gap: 12px; }
  .side-cat { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; opacity: 0.55; background: none; border: none; font-size: 7.5px; font-weight: 700; }
  .side-cat.active { opacity: 1; }
  .menu-scroll { flex: 1; overflow-y: auto; padding: 10px 10px 100px; }
  .cat-banner { background: var(--grey-opt); border-radius: 4px; padding: 4px 8px; font-weight: 700; font-size: 11px; text-transform: uppercase; text-align: center; margin-bottom: 8px; }
  .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .item-card { background: var(--card-beige); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; align-items: center; cursor: pointer; text-align: center; }
  .item-card.sold-out { opacity: 0.55; cursor: not-allowed; }
  .item-thumb-box { width: 100%; height: 75px; background: #fff; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 4px; }
  .item-thumb-box img { max-height: 90%; max-width: 90%; object-fit: contain; }

  /* Drawer */
  .checkout-tab { position: absolute; bottom: 12px; left: 14px; right: 14px; background: var(--mauve); border-radius: 24px; color: #fff; padding: 12px 18px; font-weight: 700; font-size: 13px; display: flex; justify-content: space-between; cursor: pointer; z-index: 60; }
  
  /* Payment */
  #screen-payment { padding: 20px 16px; background: #fff; align-items: center; justify-content: flex-start; gap: 12px; }
  .big-total-display { width: 100%; background: var(--card-beige); border-radius: 14px; padding: 20px; text-align: center; border: 2px solid var(--mauve); }
  .btn-confirm-order { background: var(--mauve); color: #fff; border: none; border-radius: 20px; width: 100%; padding: 12px; font-weight: 700; font-size: 13px; cursor: pointer; }

  /* Guarantee */
  #screen-guarantee { padding: 20px 16px; background: #fff; overflow-y: auto; }
  .guarantee-hero { text-align: center; background: var(--ink); color: #fff; border-radius: 16px; padding: 20px; margin-bottom: 12px; }
</style>
</head>
<body>

<div class="app">
  <!-- Closed Shift Lockout Overlay -->
  <div id="closed-overlay">
    <div class="closed-badge">NGOPI DULU</div>
    <div class="closed-title">sorry the caffe is not operating now</div>
    <p style="font-size: 11px; color: #aaa; margin-top: 10px;">Please check back once the shift is open.</p>
  </div>

  <!-- SCREEN 1: WELCOME -->
  <section class="screen active" id="screen-start">
    <div class="start-bg-front">
      <div class="logo-pill">NGOPI DULU</div>
      <input class="name-field" id="user-name" type="text" placeholder="Your Name" oninput="validateStart()" />
      <button class="start-btn" id="btn-start" onclick="openScreen('menu')" disabled>START ORDER</button>
    </div>
  </section>

  <!-- SCREEN 2: MENU -->
  <section class="screen" id="screen-menu">
    <div class="menu-content-split">
      <div class="sidebar">
        <button class="side-cat active" onclick="scrollToCat('coffee', this)">COFFEE</button>
        <button class="side-cat" onclick="scrollToCat('non-coffee', this)">NON-COFFEE</button>
        <button class="side-cat" onclick="scrollToCat('matcha', this)">MATCHA</button>
        <button class="side-cat" onclick="scrollToCat('soft-cookies', this)">COOKIES</button>
        <button class="side-cat" onclick="scrollToCat('bites', this)">BITES</button>
      </div>
      <div class="menu-scroll" id="menu-scroll"></div>
    </div>
    <div class="checkout-tab" onclick="proceedToPayment()">
      <span id="co-total-txt">RM 0.00</span>
      <span>Checkout →</span>
    </div>
  </section>

  <!-- SCREEN 3: PAYMENT -->
  <section class="screen" id="screen-payment">
    <button onclick="openScreen('menu')" style="align-self:flex-start; background:none; border:none; font-size:24px; cursor:pointer;">↩</button>
    <div class="big-total-display">
      <div style="font-size: 11px; text-transform: uppercase;">Total Amount Due</div>
      <div style="font-size: 38px; font-weight: 800;" id="pay-total-amount">RM 0.00</div>
    </div>
    <button class="btn-confirm-order" onclick="confirmOrder()">Confirm Order</button>
  </section>

  <!-- SCREEN 4: GUARANTEE PAGE -->
  <section class="screen" id="screen-guarantee">
    <div class="guarantee-hero">
      <div style="font-size: 36px; font-weight: 800; color: #ffd2d4;" id="g-order-num">#ORD-000</div>
      <div style="font-size: 18px; font-weight: 700;" id="g-customer">CUSTOMER</div>
    </div>
    <button onclick="resetApp()" style="width:100%; background:var(--mauve); color:#fff; border:none; border-radius:12px; padding:12px; font-weight:700;">Place Another Order</button>
  </section>
</div>

<script>
  let menu = JSON.parse(localStorage.getItem('ngopi_menu') || '[]');
  let cart = [];
  let customerName = '';

  function checkShiftLock() {
    const shiftStatus = localStorage.getItem('ngopi_shift_status');
    const overlay = document.getElementById('closed-overlay');
    if (shiftStatus === 'open') {
      overlay.style.display = 'none';
    } else {
      overlay.style.display = 'flex';
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    checkShiftLock();
    renderCatalog();
  });

  window.addEventListener('storage', (e) => {
    if (e.key === 'ngopi_shift_status' || e.key === 'ngopi_shift') {
      checkShiftLock();
    }
    if (e.key === 'ngopi_menu') {
      menu = JSON.parse(localStorage.getItem('ngopi_menu') || '[]');
      renderCatalog();
    }
  });

  function validateStart() {
    customerName = document.getElementById('user-name').value.trim();
    document.getElementById('btn-start').disabled = customerName.length === 0;
  }

  function openScreen(key) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + key).classList.add('active');
  }

  function scrollToCat(catKey, el) {
    document.querySelectorAll('.side-cat').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    const target = document.getElementById('sec-' + catKey);
    if (target) target.scrollIntoView({ behavior: 'smooth' });
  }

  function renderCatalog() {
    const scroll = document.getElementById('menu-scroll');
    const cats = ['coffee', 'non-coffee', 'matcha', 'soft-cookies', 'bites'];
    const labels = ['Coffee', 'Non Coffee', 'Matcha', 'Soft Cookies', 'Bites'];

    scroll.innerHTML = cats.map((cat, idx) => {
      const items = menu.filter(m => m.cat === cat);
      return `
        <div id="sec-${cat}">
          <div class="cat-banner">${labels[idx]}</div>
          <div class="menu-grid">
            ${items.map(i => `
              <div class="item-card ${i.inStock ? '' : 'sold-out'}" onclick="addToCart('${i.id}')">
                <div class="item-thumb-box"><img src="${i.img}"></div>
                <div style="font-size:10.5px; font-weight:700;">${i.name}</div>
                <div style="font-size:10px; font-weight:800;">RM ${Number(i.price).toFixed(2)}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }).join('');
  }

  function addToCart(id) {
    const item = menu.find(m => m.id === id);
    if (!item || !item.inStock) return;
    const existing = cart.find(c => c.id === id);
    if (existing) existing.qty++;
    else cart.push({ id: item.id, name: item.name, price: item.price, qty: 1 });
    updateCartUI();
  }

  function updateCartUI() {
    const tot = cart.reduce((s, i) => s + (i.price * i.qty), 0);
    document.getElementById('co-total-txt').textContent = `RM ${tot.toFixed(2)}`;
  }

  function proceedToPayment() {
    if (cart.length === 0) return;
    const tot = cart.reduce((s, i) => s + (i.price * i.qty), 0);
    document.getElementById('pay-total-amount').textContent = `RM ${tot.toFixed(2)}`;
    openScreen('payment');
  }

  function confirmOrder() {
    const tot = cart.reduce((s, i) => s + (i.price * i.qty), 0);
    const orderPayload = {
      id: 'ORD-' + Math.floor(100 + Math.random() * 900),
      customer: customerName || 'Guest',
      items: JSON.parse(JSON.stringify(cart)),
      time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
      price: Number(tot.toFixed(2)),
      status: 'Preparing'
    };

    const currentOrders = JSON.parse(localStorage.getItem('ngopi_orders') || '[]');
    currentOrders.unshift(orderPayload);
    localStorage.setItem('ngopi_orders', JSON.stringify(currentOrders));

    document.getElementById('g-order-num').textContent = `#${orderPayload.id}`;
    document.getElementById('g-customer').textContent = orderPayload.customer;
    openScreen('guarantee');
  }

  function resetApp() {
    cart = [];
    updateCartUI();
    document.getElementById('user-name').value = '';
    document.getElementById('btn-start').disabled = true;
    openScreen('start');
  }
</script>
</body>
</html>
