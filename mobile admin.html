<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>NGOPI DULU — Admin Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --rose:       #E4D0CE;
    --mauve:      #825455;
    --mauve-dark: #5A3637;
    --card-beige: #E7DAC4;
    --grey-opt:   #F3F2F1;
    --grey-border:#D8D5D2;
    --ink:        #1F1717;
    --paper:      #FFFFFF;
    --good:       #1FAA4E;
    --bad:        #E02F2F;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; width: 100%; }
  body {
    background: #121214;
    color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  button, input, select { font-family: inherit; }

  .mobile-shell {
    width: 100%;
    max-width: 440px;
    height: 100dvh;
    max-height: 920px;
    background: #F7F5F4;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  #login-screen {
    position: absolute;
    inset: 0;
    background: #121214;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
    padding: 20px;
  }
  .login-card {
    background: #fff;
    width: 100%;
    border-radius: 20px;
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .login-brand { background: #000; color: #fff; padding: 6px 18px; border-radius: 20px; font-size: 11px; font-weight: 700; margin-bottom: 20px; }
  .login-form { width: 100%; display: flex; flex-direction: column; gap: 12px; }
  .login-field { display: flex; flex-direction: column; gap: 4px; }
  .login-field label { font-size: 10px; font-weight: 700; color: #666; }
  .login-field input { padding: 10px 12px; border: 1px solid var(--grey-border); border-radius: 8px; font-size: 12px; }
  .login-btn { background: var(--mauve); color: #fff; border: none; border-radius: 8px; padding: 11px; font-weight: 700; font-size: 12px; cursor: pointer; }

  .mobile-header {
    background: var(--mauve);
    color: #fff;
    padding: max(14px, env(safe-area-inset-top, 14px)) 16px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .mobile-scroll-body { flex: 1; overflow-y: auto; padding: 12px 14px 80px 14px; }

  .kpi-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .kpi-card { background: #fff; border-radius: 10px; padding: 10px 12px; border: 1px solid var(--grey-border); }
  .kpi-label { font-size: 8.5px; font-weight: 700; color: #777; }
  .kpi-val { font-size: 16px; font-weight: 800; color: var(--mauve-dark); margin-top: 2px; }

  /* Shift Controls Bar */
  .shift-control-bar {
    background: #fff;
    border: 1px solid var(--grey-border);
    border-radius: 10px;
    padding: 10px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .btn-shift-m {
    border: none;
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 11px;
    font-weight: 800;
    cursor: pointer;
  }
  .btn-shift-m.open { background: var(--good); color: #fff; }
  .btn-shift-m.close { background: var(--bad); color: #fff; }

  .order-card {
    background: #fff;
    border-radius: 12px;
    padding: 12px;
    border: 1px solid var(--grey-border);
    margin-bottom: 10px;
  }
  .status-select { padding: 4px 8px; border-radius: 14px; font-size: 10px; font-weight: 700; border: none; }

  /* Vault list */
  .vault-m-card {
    background: #fff;
    border: 1.5px solid var(--grey-border);
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .bottom-nav {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 56px;
    background: #fff;
    border-top: 1px solid var(--grey-border);
    display: flex;
    justify-content: space-around;
    align-items: center;
  }
  .b-nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: none; color: #888; font-size: 10px; }
  .b-nav-item.active { color: var(--mauve-dark); font-weight: 800; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 16px; }
  .modal-overlay.open { display: flex; }
  .modal-card { background: #fff; width: 100%; max-width: 360px; border-radius: 16px; padding: 20px; max-height: 85vh; overflow-y: auto; }
</style>
</head>
<body>

<div class="mobile-shell">
  <div id="login-screen">
    <div class="login-card">
      <div class="login-brand">NGOPI DULU</div>
      <form class="login-form" onsubmit="handleLogin(event)">
        <div class="login-field"><label>Username</label><input type="text" id="login-username" required></div>
        <div class="login-field"><label>Password</label><input type="password" id="login-password" required></div>
        <button type="submit" class="login-btn">Sign In</button>
      </form>
    </div>
  </div>

  <header class="mobile-header">
    <div><b>NGOPI DULU</b> <span id="header-role-tag" style="font-size: 10px; color:#ffd2d4;"></span></div>
    <button onclick="handleLogout()" style="background:rgba(0,0,0,0.3); color:#fff; border:none; border-radius:6px; padding:4px 8px; font-size:10px;">Sign Out</button>
  </header>

  <main class="mobile-scroll-body">
    <div class="kpi-row" id="kpi-container">
      <div class="kpi-card"><div class="kpi-label">Shift Sales</div><div class="kpi-val" id="stat-sales">RM 0.00</div></div>
      <div class="kpi-card"><div class="kpi-label">Customers</div><div class="kpi-val" id="stat-customers">0</div></div>
    </div>

    <!-- Mobile Open/Close Shift Bar -->
    <div class="shift-control-bar" id="shift-bar">
      <div>
        <div style="font-size: 11px; font-weight: 700;" id="shift-status-m">Café Closed</div>
      </div>
      <button class="btn-shift-m open" id="btn-shift-m" onclick="toggleShiftMobile()">Open Shift</button>
    </div>

    <section id="tab-orders">
      <div id="admin-order-cards"></div>
      <button onclick="resetActiveOrdersOnly()" style="width:100%; background:#fee2e2; color:var(--bad); border:1px solid var(--bad); padding:8px; border-radius:8px; font-weight:700; font-size:11px; margin-top:10px;">Reset Shift Orders Only</button>
    </section>

    <section id="tab-analytics" style="display: none;">
      <h3 style="font-size: 12px; margin-bottom: 8px;">🗄 The Vault (Past Shifts)</h3>
      <div id="vault-mobile-cards"></div>
    </section>
  </main>

  <nav class="bottom-nav">
    <button class="b-nav-item active" id="b-orders" onclick="switchTabMobile('orders')">Orders</button>
    <button class="b-nav-item" id="b-sales" onclick="switchTabMobile('analytics')">Vault</button>
  </nav>
</div>

<!-- Shift Report Modal -->
<div class="modal-overlay" id="vault-modal">
  <div class="modal-card">
    <h3 style="font-size: 14px; margin-bottom: 10px;" id="vm-title">Shift Performance</h3>
    <div style="font-size: 11px; margin-bottom: 4px;">Opened: <span id="vm-open"></span></div>
    <div style="font-size: 11px; margin-bottom: 10px;">Closed: <span id="vm-close"></span></div>
    <div style="font-size: 16px; font-weight: 800; color: var(--mauve-dark); margin-bottom: 10px;" id="vm-rev">RM 0.00</div>
    <div style="font-size: 11px; font-weight: 700; margin-bottom: 6px;">Orders Logged:</div>
    <div id="vm-orders" style="background: #f0f0f0; border-radius: 8px; padding: 10px; max-height: 220px; overflow-y: auto; font-size: 10.5px;"></div>
    <button onclick="closeVaultModal()" style="width:100%; margin-top: 14px; background:var(--mauve); color:#fff; border:none; border-radius:8px; padding:10px; font-weight:700;">Close</button>
  </div>
</div>

<script>
  let orders = JSON.parse(localStorage.getItem('ngopi_orders') || '[]');
  let vault = JSON.parse(localStorage.getItem('ngopi_vault') || '[]');
  let shiftData = JSON.parse(localStorage.getItem('ngopi_shift') || '{"isOpen":false}');

  function handleLogin(e) {
    e.preventDefault();
    const u = document.getElementById('login-username').value;
    const p = document.getElementById('login-password').value;
    if (u === 'admin' && p === 'adm1n') {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('header-role-tag').textContent = 'ADMIN';
      renderShiftUI();
      renderOrders();
      renderVault();
    }
  }

  function handleLogout() {
    document.getElementById('login-screen').style.display = 'flex';
  }

  function renderShiftUI() {
    const btn = document.getElementById('btn-shift-m');
    const txt = document.getElementById('shift-status-m');
    if (shiftData.isOpen) {
      btn.textContent = 'Close Shift';
      btn.className = 'btn-shift-m close';
      txt.textContent = 'Status: Shift Open';
      txt.style.color = 'var(--good)';
    } else {
      btn.textContent = 'Open Shift';
      btn.className = 'btn-shift-m open';
      txt.textContent = 'Status: Café Closed';
      txt.style.color = 'var(--bad)';
    }
  }

  function toggleShiftMobile() {
    if (!shiftData.isOpen) {
      shiftData = { isOpen: true, openedAt: new Date().toLocaleString() };
      localStorage.setItem('ngopi_shift', JSON.stringify(shiftData));
      localStorage.setItem('ngopi_shift_status', 'open');
      renderShiftUI();
      alert("Shift opened!");
    } else {
      if (!confirm("Close shift and move active orders to Vault?")) return;
      const closedAt = new Date().toLocaleString();
      const totalSales = orders.reduce((sum, o) => sum + Number(o.price || 0), 0);

      vault.unshift({
        id: 'SHIFT-' + Date.now(),
        openedAt: shiftData.openedAt,
        closedAt: closedAt,
        dateLabel: new Date().toLocaleDateString('en-GB'),
        revenue: totalSales,
        customers: new Set(orders.map(o => o.customer)).size,
        orders: JSON.parse(JSON.stringify(orders))
      });
      localStorage.setItem('ngopi_vault', JSON.stringify(vault));

      orders = [];
      localStorage.setItem('ngopi_orders', JSON.stringify(orders));

      shiftData = { isOpen: false, openedAt: null };
      localStorage.setItem('ngopi_shift', JSON.stringify(shiftData));
      localStorage.setItem('ngopi_shift_status', 'closed');

      renderShiftUI();
      renderOrders();
      renderVault();
    }
  }

  function resetActiveOrdersOnly() {
    const pin = prompt("Enter PIN (1234):");
    if (pin === "1234") {
      orders = [];
      localStorage.setItem('ngopi_orders', JSON.stringify(orders));
      renderOrders();
    }
  }

  function renderOrders() {
    const list = document.getElementById('admin-order-cards');
    const tot = orders.reduce((s,o)=>s+Number(o.price||0), 0);
    document.getElementById('stat-sales').textContent = `RM ${tot.toFixed(2)}`;
    document.getElementById('stat-customers').textContent = new Set(orders.map(o=>o.customer)).size;

    if (orders.length === 0) { list.innerHTML = '<div style="text-align:center; padding:20px; font-size:11px; color:#888;">No active orders.</div>'; return; }
    list.innerHTML = orders.map(o => `
      <div class="order-card">
        <div style="display:flex; justify-content:space-between; font-weight:800; font-size:12px;"><span>#${o.id} · ${o.customer}</span><span>RM ${Number(o.price).toFixed(2)}</span></div>
        <div style="font-size:10px; color:#666; margin:4px 0;">${Array.isArray(o.items) ? o.items.map(i=>`${i.name} x${i.qty}`).join(', ') : o.items}</div>
        <div style="font-size:9.5px; color:#999;">${o.time}</div>
      </div>
    `).join('');
  }

  function renderVault() {
    const wrap = document.getElementById('vault-mobile-cards');
    if (vault.length === 0) { wrap.innerHTML = '<div style="font-size:11px; color:#888; text-align:center; padding:20px;">Vault is empty.</div>'; return; }
    wrap.innerHTML = vault.map(v => `
      <div class="vault-m-card" onclick="openVaultReport('${v.id}')">
        <div><div style="font-weight:700; font-size:11.5px;">${v.dateLabel}</div><div style="font-size:9px; color:#777;">${v.orders.length} orders</div></div>
        <div style="font-weight:800; color:var(--mauve);">RM ${Number(v.revenue).toFixed(2)}</div>
      </div>
    `).join('');
  }

  function openVaultReport(id) {
    const v = vault.find(x => x.id === id);
    if (!v) return;
    document.getElementById('vm-title').textContent = `Shift Report: ${v.dateLabel}`;
    document.getElementById('vm-open').textContent = v.openedAt;
    document.getElementById('vm-close').textContent = v.closedAt;
    document.getElementById('vm-rev').textContent = `RM ${Number(v.revenue).toFixed(2)}`;
    document.getElementById('vm-orders').innerHTML = v.orders.map(o => `
      <div style="border-bottom:1px solid #ddd; padding:4px 0;">
        <b>#${o.id} - ${o.customer}</b>: RM ${Number(o.price).toFixed(2)} (${o.time})
      </div>
    `).join('');
    document.getElementById('vault-modal').classList.add('open');
  }

  function closeVaultModal() { document.getElementById('vault-modal').classList.remove('open'); }

  function switchTabMobile(tab) {
    document.getElementById('tab-orders').style.display = tab === 'orders' ? 'block' : 'none';
    document.getElementById('tab-analytics').style.display = tab === 'analytics' ? 'block' : 'none';
    document.getElementById('b-orders').classList.toggle('active', tab === 'orders');
    document.getElementById('b-sales').classList.toggle('active', tab === 'analytics');
  }
</script>
</body>
</html>
